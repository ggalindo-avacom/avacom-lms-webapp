<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1260" viewBox="0 0 1800 1260" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de secuencia — Gestión de glosario AVACOM LMS</title>
  <desc id="description">Secuencia UML para leer, importar, gestionar, exportar y previsualizar términos del glosario.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#30343b"/>
    </marker>
    <marker id="returnArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7b818a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#111827" flood-opacity=".12"/>
    </filter>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#17191d}
      .subtitle{font:400 15px Arial,sans-serif;fill:#68707c}
      .actor{fill:#fff;stroke:#e5262b;stroke-width:2}
      .actorText{font:700 15px Arial,sans-serif;fill:#24272c;text-anchor:middle}
      .life{stroke:#a7adb5;stroke-width:1.5;stroke-dasharray:8 7}
      .message{stroke:#30343b;stroke-width:1.8;marker-end:url(#arrow)}
      .return{stroke:#7b818a;stroke-width:1.6;stroke-dasharray:7 5;marker-end:url(#returnArrow)}
      .label{font:500 13px Arial,sans-serif;fill:#272b31}
      .returnLabel{font:400 12px Arial,sans-serif;fill:#656c76}
      .section{fill:#fff;stroke:#d9dde3;stroke-width:1.5}
      .sectionHead{fill:#e5262b}
      .sectionText{font:700 14px Arial,sans-serif;fill:#fff}
      .note{fill:#fff8f8;stroke:#f1b9bb;stroke-width:1}
      .noteText{font:400 12px Arial,sans-serif;fill:#6e2528}
      .activation{fill:#fdebec;stroke:#e5262b;stroke-width:1}
    </style>
  </defs>

  <rect width="1800" height="1260" fill="#fff"/>
  <rect x="0" y="0" width="1800" height="10" fill="#e5262b"/>
  <text x="70" y="62" class="title">Gestión de glosario · Diagrama de secuencia UML</text>
  <text x="70" y="90" class="subtitle">Contexto: curso, sesión y grupo · Casos: lectura, importación, gestión, exportación y vista previa</text>

  <g filter="url(#shadow)">
    <rect x="50" y="120" width="190" height="62" rx="10" class="actor"/>
    <rect x="360" y="120" width="230" height="62" rx="10" class="actor"/>
    <rect x="720" y="120" width="230" height="62" rx="10" class="actor"/>
    <rect x="1080" y="120" width="240" height="62" rx="10" class="actor"/>
    <rect x="1480" y="120" width="240" height="62" rx="10" class="actor"/>
  </g>
  <text x="145" y="157" class="actorText">Usuario autorizado</text>
  <text x="475" y="148" class="actorText">Frontend React</text>
  <text x="475" y="167" class="actorText">Módulo Glosario</text>
  <text x="835" y="148" class="actorText">API Django REST</text>
  <text x="835" y="167" class="actorText">Glosario</text>
  <text x="1200" y="148" class="actorText">Servicio Importar /</text>
  <text x="1200" y="167" class="actorText">Exportar</text>
  <text x="1600" y="148" class="actorText">Repositorio / BD</text>

  <line x1="145" y1="182" x2="145" y2="1205" class="life"/>
  <line x1="475" y1="182" x2="475" y2="1205" class="life"/>
  <line x1="835" y1="182" x2="835" y2="1205" class="life"/>
  <line x1="1200" y1="182" x2="1200" y2="1205" class="life"/>
  <line x1="1600" y1="182" x2="1600" y2="1205" class="life"/>

  <rect x="32" y="215" width="1736" height="178" rx="8" class="section"/>
  <rect x="32" y="215" width="220" height="28" rx="8" class="sectionHead"/>
  <text x="48" y="234" class="sectionText">1 · LEER GLOSARIO</text>
  <line x1="145" y1="266" x2="475" y2="266" class="message"/>
  <text x="220" y="257" class="label">Abrir glosario(contexto, filtros)</text>
  <line x1="475" y1="300" x2="835" y2="300" class="message"/>
  <text x="535" y="291" class="label">GET /terms?course&amp;session&amp;group</text>
  <rect x="827" y="294" width="16" height="63" class="activation"/>
  <line x1="835" y1="327" x2="1600" y2="327" class="message"/>
  <text x="1045" y="318" class="label">Buscar términos autorizados y paginados</text>
  <line x1="1600" y1="355" x2="835" y2="355" class="return"/>
  <text x="1220" y="347" class="returnLabel">Colección + total + metadatos</text>
  <line x1="835" y1="378" x2="475" y2="378" class="return"/>
  <text x="570" y="370" class="returnLabel">200 · data + meta</text>

  <rect x="32" y="410" width="1736" height="250" rx="8" class="section"/>
  <rect x="32" y="410" width="250" height="28" rx="8" class="sectionHead"/>
  <text x="48" y="429" class="sectionText">2 · IMPORTAR TÉRMINOS</text>
  <line x1="145" y1="462" x2="475" y2="462" class="message"/>
  <text x="205" y="453" class="label">Seleccionar archivo, formato y modo</text>
  <line x1="475" y1="496" x2="835" y2="496" class="message"/>
  <text x="535" y="487" class="label">POST /imports/validate</text>
  <line x1="835" y1="530" x2="1200" y2="530" class="message"/>
  <text x="905" y="521" class="label">Analizar, mapear y validar filas</text>
  <line x1="1200" y1="560" x2="835" y2="560" class="return"/>
  <text x="925" y="551" class="returnLabel">Vista previa + errores por fila</text>
  <line x1="835" y1="587" x2="475" y2="587" class="return"/>
  <text x="560" y="578" class="returnLabel">Informe de validación</text>
  <line x1="145" y1="615" x2="475" y2="615" class="message"/>
  <text x="230" y="606" class="label">Confirmar importación</text>
  <line x1="475" y1="640" x2="835" y2="640" class="message"/>
  <text x="540" y="631" class="label">POST /imports</text>
  <line x1="835" y1="640" x2="1200" y2="640" class="message"/>
  <line x1="1200" y1="640" x2="1600" y2="640" class="message"/>
  <text x="1275" y="631" class="label">Crear / actualizar términos</text>

  <rect x="32" y="677" width="1736" height="203" rx="8" class="section"/>
  <rect x="32" y="677" width="250" height="28" rx="8" class="sectionHead"/>
  <text x="48" y="696" class="sectionText">3 · GESTIONAR TÉRMINO</text>
  <line x1="145" y1="732" x2="475" y2="732" class="message"/>
  <text x="210" y="723" class="label">Crear, editar o archivar término</text>
  <line x1="475" y1="768" x2="835" y2="768" class="message"/>
  <text x="520" y="759" class="label">POST / PATCH / DELETE term</text>
  <rect x="827" y="761" width="16" height="72" class="activation"/>
  <line x1="835" y1="800" x2="1600" y2="800" class="message"/>
  <text x="1010" y="791" class="label">Validar permisos, duplicados y persistir</text>
  <line x1="1600" y1="833" x2="835" y2="833" class="return"/>
  <text x="1210" y="824" class="returnLabel">Término guardado / conflicto</text>
  <line x1="835" y1="858" x2="475" y2="858" class="return"/>
  <text x="555" y="849" class="returnLabel">Resultado + estado actualizado</text>

  <rect x="32" y="897" width="1736" height="155" rx="8" class="section"/>
  <rect x="32" y="897" width="235" height="28" rx="8" class="sectionHead"/>
  <text x="48" y="916" class="sectionText">4 · EXPORTAR TÉRMINOS</text>
  <line x1="145" y1="950" x2="475" y2="950" class="message"/>
  <text x="215" y="941" class="label">Elegir formato, alcance y filtros</text>
  <line x1="475" y1="980" x2="835" y2="980" class="message"/>
  <text x="535" y="971" class="label">POST /exports</text>
  <line x1="835" y1="1008" x2="1200" y2="1008" class="message"/>
  <text x="915" y="999" class="label">Generar CSV / XLSX / JSON</text>
  <line x1="1200" y1="1033" x2="475" y2="1033" class="return"/>
  <text x="755" y="1024" class="returnLabel">Archivo descargable UTF-8</text>

  <rect x="32" y="1069" width="1736" height="136" rx="8" class="section"/>
  <rect x="32" y="1069" width="200" height="28" rx="8" class="sectionHead"/>
  <text x="48" y="1088" class="sectionText">5 · VISTA PREVIA</text>
  <line x1="145" y1="1120" x2="475" y2="1120" class="message"/>
  <text x="220" y="1111" class="label">Solicitar vista de término</text>
  <line x1="475" y1="1150" x2="835" y2="1150" class="message"/>
  <text x="520" y="1141" class="label">POST /terms/preview</text>
  <line x1="835" y1="1180" x2="475" y2="1180" class="return"/>
  <text x="535" y="1171" class="returnLabel">HTML sanitizado, sin persistir</text>

  <rect x="1360" y="1085" width="360" height="84" rx="8" class="note"/>
  <text x="1380" y="1110" class="noteText">Regla transversal</text>
  <text x="1380" y="1132" class="noteText">La API valida autenticación, contexto de curso,</text>
  <text x="1380" y="1153" class="noteText">sesión/grupo y permisos en cada operación.</text>

  <text x="70" y="1238" class="subtitle">AVACOM LMS · Propuesta de arquitectura para modernización del módulo de glosario</text>
  <circle cx="1690" cy="1230" r="8" fill="#e5262b"/>
  <circle cx="1715" cy="1230" r="8" fill="#01a4e1"/>
  <circle cx="1740" cy="1230" r="8" fill="#019d60"/>
</svg>
